<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Typing Practice</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#20242c}
body{min-height:100vh;min-height:100dvh}
button,input{font:inherit}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.header{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,255,255,.94);border-bottom:1px solid #e5e8ef}
.logo{font-size:18px;font-weight:700}
.reset-btn,.restart-btn{border:0;cursor:pointer;border-radius:9px}
.reset-btn{background:transparent;color:#667085;padding:8px 12px}
.reset-btn:hover{background:#f0f2f6;color:#20242c}
.main{width:100%;max-width:1200px;flex:1;margin:0 auto;padding:32px 24px calc(32px + env(safe-area-inset-bottom))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:#fff;border:1px solid #e5e8ef;border-radius:12px;padding:13px 16px}
.stat-label{color:#8a93a3;font-size:12px;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.content{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px}
.history,.typing-card{background:#fff;border:1px solid #e5e8ef;border-radius:16px}
.history{padding:20px;min-height:430px}
.panel-title{font-size:16px;font-weight:700;margin-bottom:4px}
.panel-subtitle{font-size:12px;color:#98a0ad;margin-bottom:16px}
.history-list{display:flex;flex-direction:column;gap:7px}
.history-item{display:grid;grid-template-columns:1fr auto;align-items:center;padding:10px 8px;border-radius:9px;background:#f7f8fa}
.history-main{font-weight:700;font-size:14px}
.history-meta{font-size:11px;color:#8a93a3;margin-top:2px}
.history-accuracy{font-size:13px;font-weight:600}
.empty{color:#98a0ad;font-size:13px;line-height:1.6;padding:14px 4px}
.typing-card{padding:28px;min-width:0}
.progress{height:4px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-bottom:28px}
.progress-bar{height:100%;width:0;background:#4f7cff;transition:width .15s}
.text-display{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:25px;line-height:1.85;letter-spacing:.2px;color:#c4c9d2;min-height:220px;user-select:none;cursor:text;word-break:break-word}
.char{position:relative;border-radius:3px}
.char.correct{color:#20242c}
.char.incorrect{color:#e5484d;background:#fff0f0}
.char.current{color:#20242c}
.char.current::after{content:"";position:absolute;left:-2px;top:8%;bottom:8%;width:2px;background:#4f7cff;border-radius:2px;animation:blink 1s infinite}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
.typing-input{position:fixed;left:-100px;top:-100px;width:1px;height:1px;opacity:0}
.hint{text-align:center;color:#98a0ad;font-size:13px;margin-top:20px}
.result{display:none;text-align:center;padding-top:24px}
.result.show{display:block}
.result-title{font-size:24px;font-weight:700}
.result-description{color:#7c8492;font-size:13px;margin:5px 0 20px}
.result-stats{display:flex;justify-content:center;gap:40px;margin-bottom:20px}
.result-item-value{font-size:27px;font-weight:700}
.result-item-label{font-size:11px;color:#8a93a3;margin-top:2px}
.restart-btn{background:#20242c;color:#fff;padding:10px 20px}
.restart-btn:hover{background:#333842}
.keyboard-space{display:none}

@media (orientation:portrait){
  .content{grid-template-columns:1fr}
  .history{order:2}
  .typing-card{order:1}
}

@media (orientation:landscape) and (max-width:900px){
  .content{grid-template-columns:220px minmax(0,1fr)}
  .history{padding:16px}
  .typing-card{padding:22px}
  .text-display{font-size:22px}
}

@media (max-width:700px){
  .header{height:56px;padding:0 16px}
  .main{padding:20px 14px calc(220px + env(safe-area-inset-bottom))}
  .stats{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{padding:11px 13px}
  .stat-value{font-size:19px}
  .content{gap:12px}
  .typing-card{padding:18px;border-radius:14px}
  .text-display{font-size:20px;line-height:1.85;min-height:240px}
  .history{min-height:0}
}

@media (min-width:701px) and (max-width:1100px){
  .main{padding-bottom:calc(240px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="logo">Typing Practice</div>
  <button class="reset-btn" id="resetBtn">Restart</button>
</header>

<main class="main">
  <section class="stats">
    <div class="stat"><div class="stat-label">WPM</div><div class="stat-value" id="wpm">0</div></div>
    <div class="stat"><div class="stat-label">Accuracy</div><div class="stat-value" id="accuracy">100%</div></div>
    <div class="stat"><div class="stat-label">Characters</div><div class="stat-value" id="characters">0</div></div>
    <div class="stat"><div class="stat-label">Time</div><div class="stat-value" id="time">0s</div></div>
  </section>

  <section class="content">
    <aside class="history">
      <div class="panel-title">Recent Results</div>
      <div class="panel-subtitle">Last 10 practices</div>
      <div class="history-list" id="historyList"></div>
    </aside>

    <section class="typing-card" id="typingCard">
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <div class="text-display" id="textDisplay"></div>
      <input id="typingInput" class="typing-input" type="text"
             autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false" inputmode="text">
      <div class="hint" id="hint">Click the text and start typing</div>

      <div class="result" id="result">
        <div class="result-title">Practice Complete</div>
        <div class="result-description">Nice work. Try again and improve your score.</div>
        <div class="result-stats">
          <div><div class="result-item-value" id="resultWpm">0</div><div class="result-item-label">WPM</div></div>
          <div><div class="result-item-value" id="resultAccuracy">100%</div><div class="result-item-label">Accuracy</div></div>
          <div><div class="result-item-value" id="resultTime">0s</div><div class="result-item-label">Time</div></div>
        </div>
        <button class="restart-btn" id="restartBtn">Try Again</button>
      </div>
    </section>
  </section>

  <div class="keyboard-space" aria-hidden="true"></div>
</main>
</div>

<script>
const sentences=[
"The quick brown fox jumps over the lazy dog.",
"Learning to type takes time and regular practice.",
"Small improvements every day can make a big difference.",
"Good typing skills help you work faster and more comfortably.",
"Focus on accuracy first and speed will come naturally.",
"Practice makes progress, so keep going and stay focused.",
"The best way to improve is to practice a little every day.",
"Keep your eyes on the screen and let your fingers follow.",
"Typing should become a natural skill that requires less thinking.",
"Stay relaxed, keep a steady rhythm, and enjoy the practice."
];

const DB_NAME="TypingPracticeDB";
const DB_VERSION=1;
const STORE="results";

let db=null,text="",currentIndex=0,correctCount=0,errorCount=0,startTime=null,timer=null,finished=false;
let states=[];

const $=id=>document.getElementById(id);
const textDisplay=$("textDisplay"),typingInput=$("typingInput"),historyList=$("historyList");

function openDB(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,DB_VERSION);
    request.onupgradeneeded=e=>{
      const database=e.target.result;
      if(!database.objectStoreNames.contains(STORE)){
        const store=database.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});
        store.createIndex("timestamp","timestamp");
      }
    };
    request.onsuccess=e=>{db=e.target.result;resolve(db)};
    request.onerror=()=>reject(request.error);
  });
}

function saveResult(record){
  return new Promise((resolve,reject)=>{
    if(!db){reject(new Error("IndexedDB unavailable"));return}
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).add(record);
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
}

function getRecentResults(limit=10){
  return new Promise((resolve,reject)=>{
    if(!db){resolve([]);return}
    const tx=db.transaction(STORE,"readonly");
    const store=tx.objectStore(STORE);
    const request=store.index("timestamp").openCursor(null,"prev");
    const rows=[];
    request.onsuccess=e=>{
      const cursor=e.target.result;
      if(cursor && rows.length<limit){
        rows.push(cursor.value);cursor.continue();
      }else resolve(rows);
    };
    request.onerror=()=>reject(request.error);
  });
}

function formatDate(ts){
  const d=new Date(ts);
  return d.toLocaleString([],{
    month:"short",day:"numeric",
    hour:"2-digit",minute:"2-digit"
  });
}

async function renderHistory(){
  const rows=await getRecentResults(10);
  if(!rows.length){
    historyList.innerHTML='<div class="empty">No practice results yet.<br>Complete a practice to see it here.</div>';
    return;
  }
  historyList.innerHTML=rows.map(r=>`
    <div class="history-item">
      <div>
        <div class="history-main">${r.wpm} WPM</div>
        <div class="history-meta">${formatDate(r.timestamp)} · ${r.duration}s</div>
      </div>
      <div class="history-accuracy">${r.accuracy}%</div>
    </div>
  `).join("");
}

function randomSentence(){
  return sentences[Math.floor(Math.random()*sentences.length)];
}

function init(){
  clearInterval(timer);
  timer=null;
  text=randomSentence();
  currentIndex=0;
  correctCount=0;
  errorCount=0;
  startTime=null;
  finished=false;
  states=new Array(text.length).fill(null);
  typingInput.value="";
  $("result").classList.remove("show");
  $("hint").textContent="Click the text and start typing";
  renderText();
  updateStats();
}

function renderText(){
  textDisplay.innerHTML="";
  for(let i=0;i<text.length;i++){
    const span=document.createElement("span");
    span.className="char";
    span.textContent=text[i];
    if(states[i]==="correct")span.classList.add("correct");
    if(states[i]==="incorrect")span.classList.add("incorrect");
    if(i===currentIndex&&!finished)span.classList.add("current");
    textDisplay.appendChild(span);
  }
}

function startTimer(){
  if(startTime!==null)return;
  startTime=Date.now();
  timer=setInterval(updateStats,250);
  $("hint").textContent="Keep typing...";
}

function handleInput(){
  if(finished)return;
  const value=typingInput.value;
  if(!value)return;
  startTimer();

  for(const char of value){
    if(currentIndex>=text.length)break;
    if(char===text[currentIndex]){
      correctCount++;
      states[currentIndex]="correct";
    }else{
      errorCount++;
      states[currentIndex]="incorrect";
    }
    currentIndex++;
  }
  typingInput.value="";
  renderText();
  updateStats();
  if(currentIndex>=text.length)finish();
}

function updateStats(){
  const elapsed=startTime?(Date.now()-startTime)/1000:0;
  const minutes=elapsed/60;
  const wpm=minutes>0?Math.round(correctCount/5/minutes):0;
  const total=correctCount+errorCount;
  const accuracy=total?Math.round(correctCount/total*100):100;
  $("wpm").textContent=wpm;
  $("accuracy").textContent=accuracy+"%";
  $("characters").textContent=total;
  $("time").textContent=Math.floor(elapsed)+"s";
  $("progressBar").style.width=(text.length?currentIndex/text.length*100:0)+"%";
}

async function finish(){
  finished=true;
  clearInterval(timer);
  timer=null;
  const elapsed=startTime?(Date.now()-startTime)/1000:0;
  const minutes=elapsed/60;
  const wpm=minutes>0?Math.round(correctCount/5/minutes):0;
  const total=correctCount+errorCount;
  const accuracy=total?Math.round(correctCount/total*100):100;
  $("resultWpm").textContent=wpm;
  $("resultAccuracy").textContent=accuracy+"%";
  $("resultTime").textContent=Math.floor(elapsed)+"s";
  $("hint").textContent="";
  renderText();
  $("result").classList.add("show");

  try{
    await saveResult({
      timestamp:Date.now(),
      wpm,accuracy,
      characters:total,
      errors:errorCount,
      duration:Math.floor(elapsed),
      text
    });
    await renderHistory();
  }catch(err){
    console.error("Could not save result:",err);
  }
}

function focusInput(){
  if(!finished)typingInput.focus({preventScroll:true});
}

textDisplay.addEventListener("click",focusInput);
$("typingCard").addEventListener("click",e=>{
  if(e.target!==$("restartBtn"))focusInput();
});
typingInput.addEventListener("input",handleInput);
$("resetBtn").addEventListener("click",()=>{init();focusInput()});
$("restartBtn").addEventListener("click",()=>{init();focusInput()});

window.addEventListener("resize",()=>updateStats());

(async function(){
  try{
    await openDB();
    await renderHistory();
  }catch(err){
    console.error("IndexedDB unavailable:",err);
  }
  init();
})();
</script>
</body>
</html>
