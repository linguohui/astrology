<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#f7dce8">

    <title>星座计算器</title>

    <style>
        /* =====================================================
           基础
        ===================================================== */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;

            background:
                linear-gradient(180deg,
                    #fdf1f6 0%,
                    #f8edf3 45%,
                    #f5eef5 100%);

            color: #4b4147;
        }

        body {
            min-height: 100vh;
        }


        /* =====================================================
           页面
        ===================================================== */

        .page {
            width: 100%;
            max-width: 520px;

            min-height: 100vh;

            margin: 0 auto;

            padding:
                0 16px calc(30px + env(safe-area-inset-bottom));
        }


        /* =====================================================
           顶部
        ===================================================== */

        .header {
            padding:
                calc(32px + env(safe-area-inset-top)) 8px 24px;

            text-align: center;
        }

        .header-icon {
            width: 62px;
            height: 62px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(145deg,
                    #f5b8cf,
                    #df91b2);

            box-shadow:
                0 10px 24px rgba(190, 105, 143, .20);

            font-size: 32px;
        }

        .header-title {
            margin: 0;

            font-size: 27px;
            line-height: 1.3;

            font-weight: 700;

            letter-spacing: 1px;

            color: #513d47;
        }

        .header-subtitle {
            margin-top: 7px;

            font-size: 13px;

            color: #a38d97;
        }


        /* =====================================================
           卡片
        ===================================================== */

        .card {
            width: 100%;

            margin-bottom: 14px;

            padding: 20px;

            border-radius: 22px;

            background:
                rgba(255, 255, 255, .72);

            border:
                1px solid rgba(255, 255, 255, .85);

            box-shadow:
                0 8px 28px rgba(150, 106, 128, .08);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }


        /* =====================================================
           表单标题
        ===================================================== */

        .section-title {
            display: flex;
            align-items: center;

            margin-bottom: 18px;

            font-size: 16px;
            font-weight: 700;

            color: #604954;
        }

        .section-title::before {
            content: "";

            width: 4px;
            height: 18px;

            margin-right: 9px;

            border-radius: 4px;

            background: #d88dac;
        }


        /* =====================================================
           表单
        ===================================================== */

        .form-item {
            margin-bottom: 17px;
        }

        .form-item:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;

            color: #8f7b84;
        }


        /* =====================================================
           输入框
        ===================================================== */

        select,
        input {
            display: block;

            width: 100%;
            height: 48px;

            padding:
                0 14px;

            border:
                1px solid #eadde3;

            border-radius: 13px;

            outline: none;

            background:
                rgba(255, 255, 255, .85);

            color: #54464d;

            font-family: inherit;

            font-size: 15px;

            appearance: none;
            -webkit-appearance: none;

            transition:
                border-color .2s,
                box-shadow .2s;
        }

        select {
            background-image:
                linear-gradient(45deg, transparent 50%, #b18c9d 50%),
                linear-gradient(135deg, #b18c9d 50%, transparent 50%);

            background-position:
                calc(100% - 18px) 20px,
                calc(100% - 13px) 20px;

            background-size:
                5px 5px,
                5px 5px;

            background-repeat: no-repeat;

            padding-right: 38px;
        }

        select:focus,
        input:focus {
            border-color: #d99ab5;

            box-shadow:
                0 0 0 3px rgba(217, 154, 181, .12);
        }


        /* =====================================================
           省市
        ===================================================== */

        .city-row {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }


        /* =====================================================
           日期时间
        ===================================================== */

        .datetime-row {
            display: grid;

            grid-template-columns:
                1.2fr .8fr;

            gap: 10px;
        }

        .picker-input {
            position: relative;
            width: 100%;
        }

        .picker-input input {
            cursor: pointer;
            caret-color: transparent;
        }

        .picker-input input:focus {
            outline: none;
        }

        .picker-input input::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: .65;
        }


        /* =====================================================
           计算按钮
        ===================================================== */

        .calculate-button {
            width: 100%;
            height: 52px;

            border: 0;
            border-radius: 16px;

            background:
                linear-gradient(135deg,
                    #e5a3bd,
                    #d681a7);

            color: #fff;

            font-family: inherit;

            font-size: 16px;
            font-weight: 700;

            letter-spacing: 1px;

            box-shadow:
                0 8px 18px rgba(196, 111, 147, .22);

            cursor: pointer;

            transition:
                transform .15s,
                box-shadow .15s;
        }

        .calculate-button:active {
            transform:
                scale(.97);

            box-shadow:
                0 4px 10px rgba(196, 111, 147, .18);
        }


        /* =====================================================
           错误
        ===================================================== */

        .error {
            display: none;

            margin-top: 12px;

            padding: 12px 14px;

            border-radius: 12px;

            background: #fff0f2;

            color: #c86d7d;

            font-size: 13px;

            line-height: 1.6;
        }

        .error.show {
            display: block;
        }


        /* =====================================================
           结果
        ===================================================== */

        .result {
            display: none;
        }

        .result.show {
            display: block;

            animation:
                resultIn .35s ease;
        }

        @keyframes resultIn {

            from {
                opacity: 0;
                transform:
                    translateY(10px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }


        /* =====================================================
           星座结果
        ===================================================== */

        .result-title {
            margin-bottom: 17px;

            font-size: 17px;
            font-weight: 700;

            color: #604954;
        }

        .sign-list {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 11px;
        }

        .sign-card {
            position: relative;

            min-height: 160px;

            padding:
                18px 10px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(145deg,
                    #fff7fa,
                    #fdf0f5);

            overflow: hidden;
        }

        .sign-card::before {
            content: "";

            position: absolute;

            width: 90px;
            height: 90px;

            top: -35px;
            right: -30px;

            border-radius: 50%;

            background:
                rgba(231, 177, 198, .16);
        }

        .sign-label {
            position: relative;

            margin-bottom: 6px;

            font-size: 12px;

            color: #aa939e;
        }

        .sign-symbol {
            position: relative;

            font-size: 45px;

            line-height: 1.1;

            color: #cf789d;
        }

        .sign-name {
            position: relative;

            margin-top: 7px;

            font-size: 18px;
            font-weight: 700;

            color: #624955;
        }


        /* =====================================================
           城市信息
        ===================================================== */

        .location-info {
            margin-top: 14px;

            padding: 14px;

            border-radius: 14px;

            background:
                rgba(249, 244, 247, .9);

            font-size: 12px;

            line-height: 2;

            color: #8f7d85;
        }

        .location-info div {
            display: flex;
        }

        .location-info strong {
            width: 76px;

            flex-shrink: 0;

            color: #68545e;
        }


        /* =====================================================
           Debug
        ===================================================== */

        .debug-title {
            margin-top: 16px;
            margin-bottom: 8px;

            font-size: 12px;
            font-weight: 600;

            color: #9c8992;
        }

        .debug {
            margin: 0;

            padding: 12px;

            border-radius: 12px;

            background: #29262a;

            color: #d8d1d5;

            font-family:
                Consolas,
                Monaco,
                monospace;

            font-size: 10px;

            line-height: 1.7;

            overflow-x: auto;

            white-space: pre-wrap;
            word-break: break-all;
        }


        /* =====================================================
           底部
        ===================================================== */

        .footer {
            padding:
                8px 0 20px;

            text-align: center;

            font-size: 11px;

            color: #b5a3ac;
        }


        /* =====================================================
           小屏手机
        ===================================================== */

        @media (max-width: 360px) {

            .page {
                padding-left: 12px;
                padding-right: 12px;
            }

            .header {
                padding-top: 25px;
            }

            .header-title {
                font-size: 24px;
            }

            .card {
                padding: 16px;
                border-radius: 19px;
            }

            .sign-card {
                min-height: 145px;
            }

            .sign-symbol {
                font-size: 40px;
            }

            .sign-name {
                font-size: 17px;
            }

        }
    </style>

</head>


<body>


    <div class="page">


        <!-- =====================================================
         顶部
    ====================================================== -->

        <header class="header">

            <div class="header-icon">
                ✦
            </div>

            <h1 class="header-title">
                我的星座
            </h1>

            <div class="header-subtitle">
                输入出生信息，探索你的星座
            </div>

        </header>


        <!-- =====================================================
         出生信息
    ====================================================== -->

        <section class="card">

            <div class="section-title">
                出生信息
            </div>


            <!-- 出生地点 -->

            <div class="form-item">

                <label class="form-label">
                    出生地点
                </label>

                <div class="city-row">

                    <select id="province">

                        <option value="">
                            请选择省份
                        </option>

                    </select>


                    <select id="city">

                        <option value="">
                            请先选择省份
                        </option>

                    </select>

                </div>

            </div>


            <!-- 出生日期 -->

            <div class="form-item">

                <label class="form-label" for="birth-date">
                    出生日期
                </label>

                <div class="picker-input" id="birth-date-wrapper">
                    <input id="birth-date" type="date" aria-label="出生日期">
                </div>

            </div>


            <!-- 出生时间 -->

            <div class="form-item">

                <label class="form-label" for="birth-time">
                    出生时间
                </label>

                <div class="picker-input" id="birth-time-wrapper">
                    <input id="birth-time" type="time" value="12:00" aria-label="出生时间">
                </div>

            </div>

        </section>


        <!-- =====================================================
         计算
    ====================================================== -->

        <section class="card">

            <button id="calculate-btn" class="calculate-button">
                查看星座报告
            </button>


            <div id="error" class="error"></div>

        </section>


        <!-- =====================================================
         结果
    ====================================================== -->

        <section id="result" class="card result">

            <div class="section-title">
                星座结果
            </div>


            <div class="sign-list">


                <!-- 太阳星座 -->

                <div class="sign-card">

                    <div class="sign-label">
                        太阳星座
                    </div>

                    <div id="sun-symbol" class="sign-symbol">
                        —
                    </div>

                    <div id="sun-name" class="sign-name">
                        —
                    </div>

                </div>


                <!-- 上升星座 -->

                <div class="sign-card">

                    <div class="sign-label">
                        上升星座
                    </div>

                    <div id="asc-symbol" class="sign-symbol">
                        —
                    </div>

                    <div id="asc-name" class="sign-name">
                        —
                    </div>

                </div>

            </div>


            <!-- 地理信息 -->

            <div id="location-info" class="location-info"></div>


            <!-- Debug -->

            <div class="debug-title">
                调试数据
            </div>

            <pre id="debug" class="debug"></pre>

        </section>


        <div class="footer">
            Astrology Calculator · Pure JavaScript
        </div>


    </div>


    <!-- =========================================================
     JavaScript
========================================================== -->

    <script src="cities.js"></script>
    <script src="astrology.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const birthDate =
                    document.getElementById("birth-date");
                const today =
                    new Date();

                const year =
                    today.getFullYear();

                const month =
                    String(
                        today.getMonth() + 1
                    ).padStart(2, "0");

                const day =
                    String(
                        today.getDate()
                    ).padStart(2, "0");

                const todayString =
                    `${year}-${month}-${day}`;

                birthDate.min =
                    "1920-01-01";

                birthDate.max =
                    todayString;

                const birthTime =
                    document.getElementById("birth-time");

                const birthDateWrapper =
                    document.getElementById("birth-date-wrapper");

                const birthTimeWrapper =
                    document.getElementById("birth-time-wrapper");


                // ================================================
                // 点击日期区域
                // ================================================

                birthDateWrapper.addEventListener(
                    "click",
                    () => {

                        if (typeof birthDate.showPicker === "function") {

                            birthDate.showPicker();

                        } else {

                            birthDate.focus();

                        }

                    }
                );


                // ================================================
                // 点击时间区域
                // ================================================

                birthTimeWrapper.addEventListener(
                    "click",
                    () => {

                        if (typeof birthTime.showPicker === "function") {

                            birthTime.showPicker();

                        } else {

                            birthTime.focus();

                        }

                    }
                );
                birthDate.addEventListener(
                    "keydown",
                    (event) => {

                        event.preventDefault();

                    }
                );


                birthTime.addEventListener(
                    "keydown",
                    (event) => {

                        event.preventDefault();

                    }
                );

                const province =
                    document.getElementById(
                        "province"
                    );

                const city =
                    document.getElementById(
                        "city"
                    );

                const calculateBtn =
                    document.getElementById(
                        "calculate-btn"
                    );

                const error =
                    document.getElementById(
                        "error"
                    );

                const result =
                    document.getElementById(
                        "result"
                    );


                /* ================================================
                   初始化省市
                ================================================= */

                Astrology.initProvinceSelect(
                    province,
                    city
                );


                /* ================================================
                   计算
                ================================================= */

                calculateBtn.addEventListener(
                    "click",
                    () => {

                        error.classList.remove(
                            "show"
                        );

                        result.classList.remove(
                            "show"
                        );


                        try {

                            /* --------------------------------
                               日期
                            -------------------------------- */

                            const date =
                                document.getElementById(
                                    "birth-date"
                                ).value;

                            if (!date) {

                                throw new Error(
                                    "请选择出生日期"
                                );

                            }


                            const [
                                year,
                                month,
                                day
                            ] =
                                date
                                    .split("-")
                                    .map(Number);


                            /* --------------------------------
                               时间
                            -------------------------------- */

                            const time =
                                document.getElementById(
                                    "birth-time"
                                ).value;

                            if (!time) {

                                throw new Error(
                                    "请选择出生时间"
                                );

                            }


                            const [
                                hour,
                                minute
                            ] =
                                time
                                    .split(":")
                                    .map(Number);


                            /* --------------------------------
                               省市
                            -------------------------------- */

                            if (!province.value) {

                                throw new Error(
                                    "请选择出生省份"
                                );

                            }

                            if (!city.value) {

                                throw new Error(
                                    "请选择出生城市"
                                );

                            }


                            /* --------------------------------
                               计算
                            -------------------------------- */

                            const data =
                                Astrology.calculateAstrology({

                                    province:
                                        province.value,

                                    city:
                                        city.value,

                                    year,

                                    month,

                                    day,

                                    hour,

                                    minute

                                });


                            console.log(
                                "Astrology Result:",
                                data
                            );

                            var sunNumber = data.sun.number
                            var ascendantNumber = data.ascendant.number
                            sunNumber = 1

                            location.href = `./free_reports/${sunNumber}_${ascendantNumber}.html`

                        }


                        catch (e) {

                            console.error(e);

                            error.textContent =
                                e.message ||
                                "计算失败";

                            error.classList.add(
                                "show"
                            );

                        }

                    }

                );

            }

        );

    </script>


</body>

</html>
