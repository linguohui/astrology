<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>打字练习</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #fff;
        --line: #e5e8ef;
        --text: #20242c;
        --muted: #8a93a3;
        --soft: #f3f5f8;
        --accent: #4f7cff;
        --error: #e5484d;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
      }
      .app {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      main {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
        flex: 1;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .history {
        padding: 18px 20px;
      }
      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        margin-bottom: 4px;
      }
      .history-title {
        font-size: 16px;
        font-weight: 750;
        margin: 0;
      }
      .history-actions {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .history-actions button {
        font: inherit;
        height: 32px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
        color: var(--text);
        padding: 0 14px;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .history-actions button:hover {
        background: var(--soft);
        border-color: #c8cedb;
      }
      .history-actions button:active {
        transform: scale(0.97);
      }
      .history-actions .state-btn {
        background: #f8f9fc;
        border-color: #dce0e9;
        min-width: 60px;
      }
      .history-actions .state-btn.active {
        background: #eef2ff;
        border-color: var(--accent);
        color: var(--accent);
      }
      .history-actions .start-btn {
        background: var(--text);
        border-color: var(--text);
        color: #fff;
        font-weight: 650;
        padding: 0 18px;
      }
      .history-actions .start-btn:hover {
        background: #2f3540;
        border-color: #2f3540;
      }
      .history-sub {
        font-size: 12px;
        color: var(--muted);
        margin: 3px 0 13px;
      }
      .history-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .history-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        background: #f7f8fa;
        border-radius: 9px;
        padding: 9px 12px;
      }
      .hm {
        font-weight: 700;
        font-size: 14px;
      }
      .hs {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .ha {
        font-size: 13px;
        font-weight: 650;
        align-self: center;
      }
      .empty {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.6;
      }
      .typing {
        padding: 28px 30px;
        min-width: 0;
      }
      .text-area {
        min-height: 280px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .text {
        font-family: Consolas, "SFMono-Regular", "Liberation Mono", monospace;
        font-size: 28px;
        line-height: 1.85;
        word-break: break-word;
        color: #c4c9d2;
        user-select: none;
        cursor: text;
      }
      .char {
        position: relative;
        border-radius: 3px;
        transition: background 0.1s;
      }
      .correct {
        color: var(--text);
      }
      .incorrect {
        color: var(--error);
        background: #fff0f0;
      }
      .current {
        color: var(--text);
      }
      .current:after {
        content: "";
        position: absolute;
        left: -2px;
        top: 8%;
        bottom: 8%;
        width: 2px;
        background: var(--accent);
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%,
        45% {
          opacity: 1;
        }
        46%,
        100% {
          opacity: 0;
        }
      }
      .meta-row {
        background: var(--soft);
        border-radius: 9px;
        padding: 12px 14px;
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 8px 16px;
      }
      .translation {
        background: transparent;
        padding: 0;
        color: #7c8492;
        font-size: 13px;
        line-height: 1.7;
        flex: 1 1 auto;
        min-width: 100px;
      }
      .author {
        margin-top: 0;
        font-size: 12px;
        color: var(--muted);
        flex: 0 0 auto;
        white-space: nowrap;
        background: transparent;
        padding: 0;
      }
      .author b {
        color: #697386;
      }
      .badge {
        font-size: 10px;
        background: #eef2ff;
        color: #5570c9;
        padding: 2px 6px;
        border-radius: 99px;
        margin-left: 6px;
      }
      .hint {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        margin-top: 18px;
      }
      .result {
        display: none;
        text-align: center;
        border-top: 1px solid var(--line);
        margin-top: 20px;
        padding-top: 20px;
      }
      .result.show {
        display: block;
      }
      .result-title {
        font-size: 22px;
        font-weight: 750;
      }
      .result-stats {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin: 15px 0 4px;
      }
      .rv {
        font-size: 26px;
        font-weight: 750;
      }
      .rl {
        font-size: 11px;
        color: var(--muted);
      }
      .input {
        position: fixed;
        left: -100px;
        top: -100px;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      @media (orientation: landscape) and (min-width: 701px) {
        .layout {
          grid-template-columns: 280px minmax(0, 1fr);
        }
        .history {
          order: 1;
        }
        .typing {
          order: 2;
        }
      }
      @media (max-width: 700px) {
        main {
          padding: 14px 12px calc(200px + env(safe-area-inset-bottom));
        }
        .history {
          padding: 14px 16px;
        }
        .history-header {
          flex-direction: column;
          align-items: stretch;
          gap: 6px;
        }
        .history-actions {
          justify-content: flex-start;
          flex-wrap: wrap;
        }
        .history-actions button {
          height: 30px;
          font-size: 11px;
          padding: 0 10px;
          flex: 1 0 auto;
          max-width: 100px;
        }
        .history-actions .start-btn {
          flex: 0.6;
          max-width: 80px;
        }
        .typing {
          padding: 18px 16px;
        }
        .text-area {
          min-height: 240px;
        }
        .text {
          font-size: 20px;
          line-height: 1.8;
        }
        .meta-row {
          flex-wrap: wrap;
          gap: 6px 12px;
          padding: 10px 12px;
        }
        .translation {
          font-size: 12px;
          flex: 1 1 100%;
        }
        .author {
          font-size: 11px;
          white-space: normal;
          flex: 0 1 auto;
        }
      }
      @media (max-width: 420px) {
        .history-actions button {
          font-size: 10px;
          padding: 0 6px;
          min-width: 40px;
          height: 26px;
        }
        .history-actions .start-btn {
          max-width: 60px;
          padding: 0 6px;
        }
        .typing {
          padding: 14px 12px;
        }
        .text {
          font-size: 17px;
        }
        .meta-row {
          flex-direction: column;
          align-items: stretch;
          gap: 4px;
        }
        .author {
          text-align: right;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main>
        <div class="layout">
          <aside class="card history">
            <div class="history-header">
              <div class="history-title" id="ht">最近练习</div>
              <div class="history-actions">
                <button id="uiLangBtn" class="state-btn">中文</button>
                <button id="practiceLangBtn" class="state-btn">英文练习</button>
                <button id="start" class="start-btn">开始</button>
              </div>
            </div>
            <div class="history-sub" id="hs">最近 10 次成绩</div>
            <div class="history-list" id="history"></div>
          </aside>

          <section class="card typing" id="typingCard">
            <div class="text-area">
              <div class="text" id="text"></div>
              <div class="meta-row">
                <div class="translation" id="translation"></div>
                <div class="author" id="author"></div>
              </div>
            </div>
            <input
              id="input"
              class="input"
              type="text"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              inputmode="text"
            />
            <div class="hint" id="hint">点击句子开始输入</div>
            <div class="result" id="result">
              <div class="result-title" id="rt">练习完成</div>
              <div class="result-stats">
                <div>
                  <div class="rv" id="rw">0</div>
                  <div class="rl">WPM</div>
                </div>
                <div>
                  <div class="rv" id="ra">100%</div>
                  <div class="rl" id="ral">准确率</div>
                </div>
                <div>
                  <div class="rv" id="rd">0s</div>
                  <div class="rl" id="rdl">用时</div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

          en: "The brain is a society of mind made up of many small machines.",

          zh: "深度学习模拟了人类大脑的神经神经网络。",
          en: "Deep learning simulates the neural networks of the human brain.",

        {
          author: "萨姆·阿尔特曼",
          zh: "未来最宝贵的资源是精力和专注力。",
          en: "The most valuable resources in the future are energy and focus.",
        },
        {
          author: "纳德拉",
          zh: "同理心是创新的核心动力。",
          en: "Empathy is the core driver of innovation.",
        },
        {
          author: "蒂姆·伯纳斯-李",
          zh: "万维网属于每一个人。",
          en: "The Web is for everyone.",
        },
        {
          author: "林纳斯·托瓦兹",
          zh: "代码会说话。",
          en: "Talk is cheap. Show me the code.",
        },
      ];

      // ── 界面文案 ──
      const T = {
        zh: {
          brand: "打字练习",
          start: "开始",
          practiceEn: "英文练习",
          practiceZh: "中文练习",
          recent: "最近练习",
          last10: "最近 10 次成绩",
          click: "点击句子开始输入",
          typing: "继续输入…",
          done: "练习完成",
          acc: "准确率",
          time: "用时",
          no: "还没有练习记录",
          author: "作者",
          kind: "经典思想练习",
        },
        en: {
          brand: "Typing Practice",
          start: "Start",
          practiceEn: "English",
          practiceZh: "Chinese",
          recent: "Recent Results",
          last10: "Last 10 practices",
          click: "Click the sentence and start typing",
          typing: "Keep typing…",
          done: "Practice Complete",
          acc: "Accuracy",
          time: "Time",
          no: "No practice results yet",
          author: "Author",
          kind: "Classic thought practice",
        },
      };

      // ── 状态 ──
      let db = null;
      let text = "",
        translation = "",
        author = "",
        idx = 0,
        correct = 0,
        errors = 0,
        startTime = 0,
        timer = null,
        finished = false,
        states = [];

      let uiLang = "zh";
      let practiceLang = "en";

      const $ = (id) => document.getElementById(id);
      const uiBtn = $("uiLangBtn");
      const practiceBtn = $("practiceLangBtn");
      const startBtn = $("start");

      // ── IndexedDB ──
      function openDB() {
        return new Promise((ok, no) => {
          const r = indexedDB.open("TypingPracticeDB", 2);
          r.onupgradeneeded = (e) => {
            let d = e.target.result;
            if (!d.objectStoreNames.contains("results")) {
              let s = d.createObjectStore("results", {
                keyPath: "id",
                autoIncrement: true,
              });
              s.createIndex("timestamp", "timestamp");
            }
          };
          r.onsuccess = (e) => {
            db = e.target.result;
            ok();
          };
          r.onerror = () => no(r.error);
        });
      }

      function save(row) {
        return new Promise((ok, no) => {
          let tx = db.transaction("results", "readwrite");
          tx.objectStore("results").add(row);
          tx.oncomplete = ok;
          tx.onerror = () => no(tx.error);
        });
      }

      function recent() {
        return new Promise((ok) => {
          if (!db) {
            ok([]);
            return;
          }
          let a = [],
            r = db
              .transaction("results", "readonly")
              .objectStore("results")
              .index("timestamp")
              .openCursor(null, "prev");
          r.onsuccess = (e) => {
            let c = e.target.result;
            if (c && a.length < 10) {
              a.push(c.value);
              c.continue();
            } else ok(a);
          };
        });
      }

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function fmt(t) {
        return new Date(t).toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      // ── 历史渲染 ──
      async function renderHistory() {
        let rows = await recent(),
          u = T[uiLang];
        $("history").innerHTML = rows.length
          ? rows
              .map(
                (r) => `<div class="history-item">
                                            <div><div class="hm">${r.wpm} WPM</div>
                                            <div class="hs">${fmt(r.timestamp)} · ${r.duration}s · ${r.language === "en" ? "EN" : "中"}</div></div>
                                            <div class="ha">${r.accuracy}%</div>
                                        </div>`,
              )
              .join("")
          : `<div class="empty">${u.no}</div>`;
      }

      // ── 界面语言切换 ──
      function setUILang(lang) {
        uiLang = lang;
        uiBtn.textContent = lang === "zh" ? "中文" : "English";
        const u = T[lang];
        $("ht").textContent = u.recent;
        $("hs").textContent = u.last10;
        $("rt").textContent = u.done;
        $("ral").textContent = u.acc;
        $("rdl").textContent = u.time;
        if (!finished) $("hint").textContent = u.click;
        if (author) {
          $("author").innerHTML =
            `${u.author}: <b>${esc(author)}</b><span class="badge">${u.kind}</span>`;
        }
        renderHistory();
      }

      // ── 练习语言切换 ──
      function setPracticeLang(lang) {
        practiceLang = lang;
        practiceBtn.textContent = lang === "en" ? "英文练习" : "中文练习";
        init();
      }

      // ── 核心练习 ──
      function init() {
        clearInterval(timer);
        timer = null;
        // 随机抽取硬编码语录数组中的一条
        const r = quotes[Math.floor(Math.random() * quotes.length)];
        author = r.author;
        text = practiceLang === "en" ? r.en : r.zh;
        translation = practiceLang === "en" ? r.zh : r.en;
        idx = 0;
        correct = 0;
        errors = 0;
        startTime = 0;
        finished = false;
        states = Array(text.length).fill(null);
        $("input").value = "";
        $("result").classList.remove("show");
        $("translation").textContent = translation;
        const u = T[uiLang];
        $("author").innerHTML =
          `${u.author}: <b>${esc(author)}</b><span class="badge">${u.kind}</span>`;
        $("hint").textContent = u.click;
        render();
      }

      function render() {
        $("text").innerHTML = [...text]
          .map(
            (c, i) =>
              `<span class="char ${states[i] || ""} ${i === idx && !finished ? "current" : ""}">${esc(c)}</span>`,
          )
          .join("");
      }

      function focusInput() {
        if (!finished) $("input").focus({ preventScroll: true });
      }

      function startTimer() {
        if (startTime) return;
        startTime = Date.now();
        timer = setInterval(() => {}, 1000);
        $("hint").textContent = T[uiLang].typing;
      }

      // ── 输入处理 ──
      $("input").addEventListener("input", () => {
        if (finished) return;
        let v = $("input").value;
        if (!v) return;
        startTimer();
        for (let c of v) {
          if (idx >= text.length) break;
          if (c === text[idx]) {
            correct++;
            states[idx] = "correct";
          } else {
            errors++;
            states[idx] = "incorrect";
          }
          idx++;
        }
        $("input").value = "";
        render();
        if (idx >= text.length) finish();
      });

      // ── 完成 ──
      async function finish() {
        finished = true;
        clearInterval(timer);
        let sec = startTime ? Math.max(1, (Date.now() - startTime) / 1000) : 1;
        let wpm = Math.round(correct / 5 / (sec / 60));
        let total = correct + errors,
          acc = total ? Math.round((correct / total) * 100) : 100;
        $("rw").textContent = wpm;
        $("ra").textContent = acc + "%";
        $("rd").textContent = Math.floor(sec) + "s";
        $("hint").textContent = "";
        render();
        $("result").classList.add("show");
        try {
          await save({
            timestamp: Date.now(),
            wpm,
            accuracy: acc,
            characters: total,
            errors,
            duration: Math.floor(sec),
            language: practiceLang,
            text,
            translation,
            author,
          });
        } catch (e) {
          console.error(e);
        }
        renderHistory();
      }

      // ── 事件绑定 ──
      uiBtn.addEventListener("click", () => {
        const next = uiLang === "zh" ? "en" : "zh";
        setUILang(next);
      });

      practiceBtn.addEventListener("click", () => {
        const next = practiceLang === "en" ? "zh" : "en";
        setPracticeLang(next);
      });

      startBtn.addEventListener("click", () => {
        init();
        focusInput();
      });

      $("typingCard").addEventListener("click", focusInput);
      $("text").addEventListener("click", focusInput);

      // ── 启动 ──
      (async () => {
        try {
          await openDB();
        } catch (e) {
          console.error(e);
        }
        uiLang = "zh";
        practiceLang = "en";
        uiBtn.textContent = "中文";
        practiceBtn.textContent = "英文练习";
        setUILang("zh");
        init();
        renderHistory();
      })();
    </script>
  </body>
